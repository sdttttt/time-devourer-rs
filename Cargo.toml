[package]
name = "time-devourer"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
embed-resource = "=2.5.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
